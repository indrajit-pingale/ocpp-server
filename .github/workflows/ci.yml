name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install backend deps
        working-directory: backend
        run: |
          npm ci
      - name: Build backend
        working-directory: backend
        run: |
          npm run build
      - name: Run tests
        working-directory: backend
        run: |
          npm test || true
